name: Propose a view
description: A timeline of one subject you would like to see or share, such as "The Space Race". No code needed.
title: "View: "
labels: ["view", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the view and an editor will build it, or you can build it yourself by following the README. Give a thumbs-up to proposals you want to see: the most wanted are built first and ranked highest.
  - type: input
    id: name
    attributes:
      label: Name of the view
      placeholder: The Space Race
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What question does it answer?
      description: One or two sentences. Who would enjoy it or find it useful?
    validations:
      required: true
  - type: textarea
    id: things
    attributes:
      label: Entries it should show
      description: A list of names (people, places, events, works, things). It is fine if some are not in the encyclopedia yet; say so and add a source link if you have one.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the timeline, if you built it on the page
      description: Filled in when you come from the "Propose a view" button.
  - type: textarea
    id: eras
    attributes:
      label: Chapters, if any
      description: Named periods with their years, such as "First into orbit, 1957 to 1961".
  - type: checkboxes
    id: pr
    attributes:
      label: Building it yourself?
      options:
        - label: I would like to open the pull request for this.
