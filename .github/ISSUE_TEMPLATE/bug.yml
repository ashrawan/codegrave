name: Bug
description: Something on the page looks or works wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The link you were on (it holds the views and year range) and the steps.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example Safari on iPhone 15, Chrome 130 on Windows.
