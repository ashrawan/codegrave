name: New entry
description: Someone or something is missing from the encyclopedia.
title: "Add: "
labels: ["data", "new entry"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: What kind of entry is it?
      description: For example a scientist, a city, a war, a book, a species, a ship, a programming language. A guess is fine; the full list is in data/categories.json.
  - type: textarea
    id: why
    attributes:
      label: Why it belongs
      description: Who or what it is, and why a general encyclopedia would have it.
    validations:
      required: true
  - type: textarea
    id: dates
    attributes:
      label: Key dates and sources
      description: When it began (birth, founding, first release) and when it ended, if it has, with links that back the dates up.
  - type: checkboxes
    id: pr
    attributes:
      label: Adding it yourself?
      options:
        - label: I would like to open the pull request for this.
