<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegrave — everything born here dies, or becomes something else</title>
<meta name="description" content="One timeline of everything that begins and ends, drawn as a road you travel through time: people, places, wars, books, inventions, species and planets, from first to last.">
<meta property="og:title" content="codegrave">
<meta property="og:description" content="Nothing ships forever. One timeline of everything.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='32' height='32' rx='6' fill='%23faf8f3' stroke='none'/%3E%3Cpath d='M3 27.5H29' stroke='%23121211' stroke-width='1.8'/%3E%3Cpath d='M6.5 27.5V12.5a6.5 6.5 0 0 1 13 0V27.5' stroke='%23121211' stroke-width='2.2'/%3E%3Cpath d='M21.5 27.5V20a3.5 3.5 0 0 1 7 0v7.5' stroke='%23121211' stroke-width='1.8' opacity='.55'/%3E%3Cpath d='M10 14.5l3 2.5-3 2.5' stroke='%23121211' stroke-width='2.2'/%3E%3Cpath d='M14 22.5h3.5' stroke='%239a6c00' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
// Set the theme before first paint so the page never flashes the wrong one. Light unless the visitor chose dark.
(function () {
  var t = null;
  try { t = localStorage.getItem('cg-theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>

<header class="top">
  <a class="logo" href="./" aria-label="codegrave, home">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 27.5H29" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 27.5V12.5a6.5 6.5 0 0 1 13 0V27.5" stroke="currentColor" stroke-width="1.8"/><path d="M21.5 27.5V20a3.5 3.5 0 0 1 7 0v7.5" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M10 14.5l3 2.5-3 2.5" stroke="currentColor" stroke-width="1.8"/><path d="M14 22.5h3.5" stroke="var(--acc)" stroke-width="2.2"/></svg><span>codegrave</span>
  </a>
  <div class="tsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Search the timeline: a person, a place, an event or a year" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list" aria-label="Search the timeline">
    <kbd aria-hidden="true">/</kbd>
    <ul id="qlist" role="listbox" aria-label="Found on the timeline" hidden></ul>
  </div>
  <button id="theme" class="ibtn" type="button" aria-label="Switch between dark and light">
    <svg class="to-light" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg class="to-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
  <a id="repo" class="ibtn" href="https://github.com/ashrawan/codegrave" target="_blank" rel="noopener" aria-label="codegrave on GitHub" title="Code and data on GitHub"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg></a>
  <button id="toggle-side" class="ibtn" type="button" aria-label="Show or hide the panel" aria-controls="side" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg>
  </button>
</header>

<main id="stage">
  <!-- The timeline in depth: the ground on a canvas, the year and the views at the top left, the names standing on the road -->
  <div id="road" aria-label="Timeline">
    <canvas id="road-cv" aria-hidden="true"></canvas>
    <div id="road-head"><div id="road-year" aria-hidden="true"></div><p id="road-unit" class="fine" hidden></p><div id="road-views"></div></div>
    <div id="road-labels"></div>
  </div>
  <p id="status" class="status">Loading the timeline…</p>
</main>

<aside id="side" aria-label="Timeline panel" hidden>
  <!-- What is on the timeline, how to move through it, and what to add -->
  <div id="p-views" class="pane">
    <div class="pane-head">
      <h2>Views</h2>
      <button id="info-btn" class="ibtn" type="button" aria-label="How to read the timeline" aria-expanded="false" aria-controls="info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
      </button>
      <button class="ibtn" type="button" data-hide-side aria-label="Hide the panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p id="vscope" class="fine scope"></p>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="vq" type="search" placeholder="Search views, entries or a year" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="vlist" aria-label="Search views, entries or a year">
    </label>
    <div class="chipbar" id="chipbar"><div id="topics" class="chips" role="radiogroup" aria-label="Show views about" hidden></div></div>
    <ul id="vlist" role="listbox" aria-label="Views" aria-multiselectable="true"></ul>
    <p id="vnote" class="fine"></p>
    <section id="filters" class="filters" aria-label="Filters">
      <!-- On a phone the filters fold into this one line, so the list of views has the sheet -->
      <button id="filters-btn" class="fbtn" type="button" aria-expanded="false"><span class="lab">Filters</span><output id="filters-sum"></output><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="field">
        <div class="row"><span class="lab" id="years-cap">Years</span><span class="row-r"><button id="years-reset" class="lnk" type="button" hidden>Show all years</button><output id="years-out"></output></span></div>
        <div class="yearbar" id="yearbar" role="group" aria-labelledby="years-cap">
          <div id="hist" aria-hidden="true"></div>
          <input id="y-from" type="range" step="1" aria-label="First year">
          <input id="y-to" type="range" step="1" aria-label="Last year">
        </div>
        <div class="row ticks" id="year-ticks" aria-hidden="true"></div>
      </div>
      <div class="field">
        <div class="row"><span class="lab" id="level-cap">How much to show</span><output id="shown-n"></output></div>
        <div id="level" class="seg" role="radiogroup" aria-labelledby="level-cap">
          <button type="button" role="radio" data-lv="10">Landmarks</button><button type="button" role="radio" data-lv="30">Notable</button><button type="button" role="radio" data-lv="60">Most</button><button type="button" role="radio" data-lv="100">All</button>
        </div>
      </div>
    </section>
  </div>
  <!-- The full history of one thing -->
  <div id="p-thing" class="pane" hidden></div>
  <!-- One era: what began and ended in it -->
  <div id="p-era" class="pane" hidden></div>
</aside>

<!-- The bar on the right: the whole span of years upright, the reader's marker, reverse at its head and play at its foot -->
<div id="axisbar" role="group" aria-label="Years">
  <div class="ends head">
    <button id="reverse" class="abtn" type="button" aria-label="Turn round and face the past"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4v15M20 15l-4 4-4-4M8 20V5M12 9 8 5 4 9"/></svg></button>
  </div>
  <div id="axis" tabindex="0" role="slider" aria-orientation="vertical" aria-label="Move through time"><div id="axis-in"><div id="axis-win"></div><div id="ticks"></div><div id="playhead"><span></span><i></i></div></div></div>
  <div class="ends foot">
    <button id="sound" class="sbtn" type="button" aria-pressed="true" aria-label="Sound: a soft rustle as each card opens"></button>
    <button id="play" class="abtn solid" type="button" aria-label="Play: travel along the road"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg></button>
  </div>
</div>

<!-- The views on the timeline, one pill each, along the bottom -->
<div id="dock" role="group" aria-label="Views on the timeline">
  <button id="views-btn" class="padd" type="button" aria-controls="side"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Views</span></button>
  <div id="pills"></div>
  <span class="dock-tools">
    <button id="shuffle" class="ibtn sm" type="button" aria-label="Shuffle colours" title="Shuffle colours"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c4 0 6 10 10 10H21M18 14l3 3-3 3M3 17h3.5c1.6 0 2.8-1.6 3.9-3.6M13.6 9.6C14.7 8.1 15.8 7 16.5 7H21M18 4l3 3-3 3"/></svg></button>
    <button id="save-mine" class="ibtn sm" type="button" aria-label="Save as your view" title="Save as your view"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg></button>
  </span>
  <div id="swatches" role="listbox" aria-label="Colour" hidden></div>
</div>

<div id="info" role="dialog" aria-label="How to read the timeline" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
