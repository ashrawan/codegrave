<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page meta: scripts/build.mjs writes a copy of this page for each view with this block filled in for that view -->
<title>codegrave: a timeline of everything. Nothing ships forever.</title>
<meta name="description" content="One timeline of everything that begins and ends, drawn as a road you travel through time: people, places, wars, books, inventions, species and planets, from first to last.">
<link rel="canonical" href="https://codegrave.com/">
<meta property="og:site_name" content="codegrave">
<meta property="og:type" content="website">
<meta property="og:url" content="https://codegrave.com/">
<meta property="og:title" content="codegrave: a timeline of everything">
<meta property="og:description" content="Nothing ships forever. One timeline of everything that begins and ends, drawn as a road you travel through time.">
<meta property="og:image" content="https://codegrave.com/media/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The codegrave timeline: a road running into the distance, with cards and pictures standing beside it">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="codegrave: a timeline of everything">
<meta name="twitter:description" content="Nothing ships forever. One timeline of everything that begins and ends, drawn as a road you travel through time.">
<meta name="twitter:image" content="https://codegrave.com/media/og.jpg">
<!-- /page meta -->
<meta name="theme-color" content="#070a10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='32' height='32' rx='6' fill='%23faf8f3' stroke='none'/%3E%3Cpath d='M3 27.5H29' stroke='%23121211' stroke-width='1.8'/%3E%3Cpath d='M6.5 27.5V12.5a6.5 6.5 0 0 1 13 0V27.5' stroke='%23121211' stroke-width='2.2'/%3E%3Cpath d='M21.5 27.5V20a3.5 3.5 0 0 1 7 0v7.5' stroke='%23121211' stroke-width='1.8' opacity='.55'/%3E%3Cpath d='M10 14.5l3 2.5-3 2.5' stroke='%23121211' stroke-width='2.2'/%3E%3Cpath d='M14 22.5h3.5' stroke='%239a6c00' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="account.css">
<script>
// Set the theme before first paint so the page never flashes the wrong one. Dark unless the visitor chose light.
(function () {
  var t = null;
  try { t = localStorage.getItem('cg-theme2'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>

<!-- The bar on the left: new timeline, search, explore, your timelines, your account at the foot (account.js) -->
<nav id="sb" aria-label="Your timelines">
  <div class="sb-head">
    <a class="logo" href="/" aria-label="codegrave, home">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 27.5H29" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 27.5V12.5a6.5 6.5 0 0 1 13 0V27.5" stroke="currentColor" stroke-width="1.8"/><path d="M21.5 27.5V20a3.5 3.5 0 0 1 7 0v7.5" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M10 14.5l3 2.5-3 2.5" stroke="currentColor" stroke-width="1.8"/><path d="M14 22.5h3.5" stroke="var(--acc)" stroke-width="2.2"/></svg><span class="lbl">codegrave</span>
    </a>
    <button id="sb-fold" class="ibtn" type="button" aria-label="Fold or open the sidebar" aria-controls="sb" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
  </div>
  <div id="sb-nav">
  <button id="sb-new" class="nv" type="button" title="New timeline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg><span class="lbl">New timeline</span></button>
  <button id="sb-search" class="nv" type="button" title="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="lbl">Search</span><kbd class="lbl" aria-hidden="true">/</kbd></button>
  <button id="sb-explore" class="nv" type="button" title="Explore"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span class="lbl">Explore</span></button>
  </div>
  <div id="sb-list"></div>
  <div id="sb-foot"></div>
</nav>
<div id="sb-scrim"></div>
<!-- Explore: a page over the road. Every timeline the community has published (the editors' own count as one of them), as cards -->
<section id="explore" aria-label="Explore" hidden>
  <button class="ibtn ex-x" type="button" data-sb-home aria-label="Close Explore" title="Back to the timeline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="ex-in">
    <header class="ex-head">
      <h1>Explore</h1>
      <p class="ex-sub">Timelines made by the community, on anything. <span id="vscope" class="scope"></span></p>
      <label class="search ex-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="vq" type="search" placeholder="Search timelines, people, places or a year" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="vlist" aria-label="Search timelines, people, places or a year">
      <button type="button" class="clr" data-for="vq" aria-label="Clear the search" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
      <div class="chipbar" id="chipbar"><div id="topics" class="chips" role="radiogroup" aria-label="Show timelines about" hidden></div></div>
    </header>
    <ul id="vlist" role="listbox" aria-label="Timelines" aria-multiselectable="true"></ul>
    <p id="vnote" class="fine"></p>
    <footer class="ex-foot"><span>Made one worth sharing? Publish it from your own timelines, or</span> <button id="propose" class="lnk" type="button">propose it to the editors</button><span>.</span></footer>
  </div>
</section>
<!-- New timeline: a page over the road with one box to say what it is about (account.js fills it) -->
<section id="create" aria-label="New timeline" hidden></section>
<!-- Ask for a change: under the road, for a timeline the reader made with AI -->
<form id="ask" hidden></form>
<!-- The year range: a quiet pill at the bottom right of the road; pressed, it opens the range with its picture of busy years -->
<div id="filters" class="yr">
  <div class="yr-pop" id="yr-pop">
    <div class="field">
        <div class="row"><span class="lab" id="years-cap">Years</span><span class="row-r"><button id="years-reset" class="lnk" type="button" hidden>Show all years</button><output id="years-out"></output></span></div>
        <div class="yearbar" id="yearbar" role="group" aria-labelledby="years-cap">
          <div id="hist" aria-hidden="true"></div>
          <input id="y-from" type="range" step="1" aria-label="First year">
          <input id="y-to" type="range" step="1" aria-label="Last year">
        </div>
        <div class="row ticks" id="year-ticks" aria-hidden="true"></div>
      </div>
  </div>
  <button id="filters-btn" class="yr-pill" type="button" aria-expanded="false" aria-controls="yr-pop" title="Years shown"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 19v-5M10 19V9M15 19v-8M20 19V5"/></svg><output id="filters-sum"></output></button>
</div>
<button id="info-btn" class="ibtn" hidden type="button" aria-label="How to read the timeline" aria-expanded="false" aria-controls="info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
      </button>

<!-- Shown only while a phone is zoomed in: one press brings the page back to its size -->
<button id="unzoom" type="button" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>Reset zoom</button>

<!-- There is no bar across the top: this holds the phone's menu button, the search (shown when asked for) and the state of a timeline of your own -->
<header class="top">
  <button id="sb-btn" class="ibtn" type="button" aria-label="Open the sidebar" aria-controls="sb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h11"/></svg></button>
  <span class="grow"></span>
  <div class="tsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Search the timeline: a person, a place, an event or a year" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list" aria-label="Search the timeline">
    <button type="button" class="clr" data-for="q" aria-label="Clear the search" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <kbd aria-hidden="true">/</kbd>
    <ul id="qlist" role="listbox" aria-label="Found on the timeline" hidden></ul>
  </div>
  <span id="tl-state"></span>
  <button id="toggle-side" class="ibtn" type="button" aria-label="Show or hide the panel" aria-controls="side" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg>
  </button>
</header>

<main id="stage">
  <!-- The timeline in depth: the ground on a canvas, the year and the views at the top left, the names standing on the road -->
  <div id="road" aria-label="Timeline">
    <div id="wall" aria-hidden="true"></div>
    <canvas id="road-cv" aria-hidden="true"></canvas>
    <div id="road-views"></div>
    <div id="road-head"><div id="road-year" aria-hidden="true"></div><p id="road-unit" class="fine" hidden></p></div>
    <div id="road-labels"></div>
  </div>
  <p id="status" class="status">Loading the timeline…</p>
</main>

<aside id="side" aria-label="Timeline panel" hidden>
  <!-- The full history of one thing -->
  <div id="p-thing" class="pane" hidden></div>
  <!-- One era: what began and ended in it -->
  <div id="p-era" class="pane" hidden></div>
</aside>

<!-- The bar on the right: the whole span of years upright, the reader's marker, play at its foot -->
<div id="axisbar" role="group" aria-label="Years">
  <div id="axis" tabindex="0" role="slider" aria-orientation="vertical" aria-label="Move through time"><div id="axis-in"><div id="axis-win"></div><div id="ticks"></div><div id="playhead"><span></span><i></i></div></div></div>
  <div class="ends foot">
    <button id="sound" class="sbtn" type="button" aria-pressed="true" aria-label="Sound: a quiet breath of air as each card opens"></button>
    <!-- Play, and for a view with its own music (a country's anthem) a second play beside it, in its flag -->
    <div id="plays" class="plays">
      <button id="play" class="abtn solid" type="button" aria-label="Play: travel along the road"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg></button>
      <button id="play-own" class="pown" type="button" hidden></button>
    </div>
  </div>
</div>

<!-- The views on the timeline, one pill each, along the bottom -->
<div id="dock" role="group" aria-label="Views on the timeline">
  <div id="pills"></div>
  <span class="dock-tools">
    <button id="shuffle" class="ibtn sm" type="button" data-shuffle aria-label="Shuffle colours" title="Shuffle colours" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/><circle cx="12" cy="8.6" r="1.9" fill="var(--p0)" stroke="none"/><circle cx="8.8" cy="14" r="1.9" fill="var(--p1)" stroke="none"/><circle cx="15.2" cy="14" r="1.9" fill="var(--p2)" stroke="none"/></svg></button>
    
    <button id="more-btn" class="ibtn sm" type="button" aria-label="Menu: export, settings and info" title="Export, settings and info" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>
  </span>
  <div id="swatches" role="listbox" aria-label="Colour" hidden></div>
</div>

<!-- The three dots at the bottom right, under play: export, settings and info -->
<div id="more-menu" role="menu" hidden>
  <p class="cap">This timeline</p>
  <button id="pdf" class="nv" type="button" role="menuitem"><img src="media/pdf.svg" width="14" height="17" alt=""><span>Export as PDF</span></button>
  <button id="reverse" class="nv" type="button" role="menuitem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4v15M20 15l-4 4-4-4M8 20V5M12 9 8 5 4 9"/></svg><span></span></button>
  <hr>
  <p class="cap">Settings</p>
  <button id="theme" class="nv" type="button" role="menuitem" aria-label="Switch between dark and light">
    <svg class="to-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg class="to-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <span class="to-light">Light theme</span><span class="to-dark">Dark theme</span>
  </button>
  <hr>
  <p class="cap">Info</p>
  <button id="more-info" class="nv" type="button" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg><span>How to read the timeline</span></button>
  <a class="nv" role="menuitem" href="https://github.com/ashrawan/codegrave" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>codegrave on GitHub</span></a>
</div>

<!-- Dialogs, menus and short messages of the sidebar (account.js) -->
<div id="layer" hidden></div>
<div id="toast" role="status" hidden></div>

<div id="info" role="dialog" aria-label="How to read the timeline" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
